<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Reporte IMADE | Departamento de IT</title>

    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

     <style>
        :root {
            /* El color azul exacto de tu imagen */
            --imade-blue: #1e4bb5;
            --imade-blue-dark: #163a8d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9; /* Fondo gris muy claro para resaltar las tarjetas */
            color: #1e293b;
            transition: opacity 0.3s ease;
        }

        /* Estilo del Header similar a tu imagen */
        .header-blue {
            background-color: var(--imade-blue);
            background-image: linear-gradient(135deg, var(--imade-blue) 0%, var(--imade-blue-dark) 100%);
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .dashboard-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e2e8f0;
            background: white;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--imade-blue);
        }

        .btn-panel {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .btn-panel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Header Principal (Basado en tu imagen) -->
    <header class="header-blue py-6 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="border-r border-white/30 pr-4">
                    <h1 class="text-2xl font-bold text-white leading-tight tracking-tight">
                        IMADE <span class="font-light opacity-80">| Biométrico</span>
                    </h1>
                    <p class="text-[10px] text-blue-100 uppercase tracking-[0.3em] font-medium">Departamento de IT</p>
                </div>
            </div>
            
            <div>
                <button class="btn-panel text-white text-xs font-semibold px-6 py-2 rounded-full uppercase tracking-wider">
                    Distrito Miraflores
                </button>
                
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Columna de Filtros -->
            <aside class="lg:col-span-1 space-y-6">
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase mb-6 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Configuración
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase">Archivo Excel</label>
                            <input type="file" id="fileInput" accept=".xlsx,.xls" class="w-full text-sm text-slate-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase">Tipo de Reporte</label>
                            <select id="tipoReporte" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                <option value="SEMANA">Semanal</option>
                                <option value="MES">Mensual</option>
                                <option value="ANIO">Anual</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase">Fecha Base</label>
                            <input type="date" id="fechaBase" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>

                        <button onclick="procesarExcel()" class="btn-primary w-full bg-blue-600 text-white font-bold py-3 rounded-lg text-sm mt-4 flex justify-center items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            GENERAR REPORTE
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Columna de Resultados -->
            <section class="lg:col-span-3 space-y-6">
                <div class="glass-card rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white/50">
                        <h2 class="text-sm font-bold text-slate-800 uppercase flex items-center">
                            <svg class="w-4 h-4 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            Resultados del Periodo
                        </h2>
                        <button class="btn-success bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center" onclick="exportarExcel()">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            EXPORTAR EXCEL
                        </button>
<p>
    
</p>
<button onclick="window.location.href='plataforma.html'" 
        class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider flex items-center shadow-lg transition-all">
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
    </svg>
    Salir
</button>

                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left custom-table">
                            <thead>
                                <tr>
                                    <th class="px-6 py-4">ID</th>
                                    <th class="px-6 py-4">Empleado</th>
                                    <th class="px-6 py-4">Días trabajados</th>
                                    <th class="px-6 py-4">Horas trabajadas</th>
                                    <th class="px-6 py-4">Horas de almuerzo</th>
                                </tr>
                            </thead>
                            <tbody id="tablaResultados" class="divide-y divide-slate-100 bg-white">
                                <!-- Datos generados -->
                                <tr>
                                    <td colspan="5" class="px-6 py-12 text-center text-slate-400 italic">
                                        Cargue un archivo y seleccione una fecha para comenzar
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        let reporteFinal = [];

        // ======================
        // UTILIDADES
        // ======================
        function msToHora(ms) {
            const totalMin = Math.floor(ms / 60000);
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
        }

        function mismaSemana(fecha, base) {
            const f = new Date(fecha);
            const b = new Date(base);
            const inicio = new Date(b);
            inicio.setDate(b.getDate() - b.getDay());
            const fin = new Date(inicio);
            fin.setDate(inicio.getDate() + 6);
            return f >= inicio && f <= fin;
        }

        // ======================
        // PROCESAR EXCEL
        // ======================
        function procesarExcel() {
            const file = document.getElementById("fileInput").files[0];
            const tipo = document.getElementById("tipoReporte").value;
            const fechaBase = document.getElementById("fechaBase").value;

            if (!file || !fechaBase) {
                // Personalizado en lugar de alert
                console.warn("Faltan datos");
                return;
            }

            const reader = new FileReader();
            reader.onload = e => {
                const wb = XLSX.read(e.target.result, { type: "binary" });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(sheet, { range: 1, defval: "" });
                generarReporte(data, tipo, new Date(fechaBase));
            };
            reader.readAsBinaryString(file);
        }

        // ======================
        // LÓGICA REAL BIOMÉTRICA
        // ======================
        function generarReporte(data, tipo, base) {
            const empleados = {};
            reporteFinal = [];
            document.getElementById("tablaResultados").innerHTML = "";

            data.forEach(row => {
                const id = Number(row["ID Empleado"]);
                const nombre = row["Nombre"];
                const fecha = row["Fecha"];
                const hora = row["Hora"];
                if (!id || !nombre || !fecha || !hora) return;

                const dt = new Date(`${fecha}T${hora}`);
                if (isNaN(dt)) return;

                let incluir = false;
                if (tipo === "SEMANA") incluir = mismaSemana(dt, base);
                if (tipo === "MES") incluir = dt.getMonth() === base.getMonth() && dt.getFullYear() === base.getFullYear();
                if (tipo === "ANIO") incluir = dt.getFullYear() === base.getFullYear();
                if (!incluir) return;

                empleados[id] ??= { id, nombre, dias: {} };
                empleados[id].dias[fecha] ??= [];
                empleados[id].dias[fecha].push(dt);
            });

            Object.values(empleados).forEach(emp => {
                let dias = 0;
                let trabajoMs = 0;
                let almuerzoMs = 0;

                Object.values(emp.dias).forEach(marcas => {
                    marcas.sort((a, b) => a - b);
                    if (marcas.length < 2) return;

                    dias++;

                    const entrada = marcas.find(m => m.getHours() < 12) || marcas[0];
                    const salida = [...marcas].reverse().find(m => m.getHours() >= 14) || marcas[marcas.length - 1];

                    if (!entrada || !salida || salida <= entrada) return;

                    let almuerzo = 0;
                    const almuerzos = marcas.filter(m => m.getHours() >= 12 && m.getHours() <= 14);
                    if (almuerzos.length >= 2) {
                        const posible = almuerzos[1] - almuerzos[0];
                        if (posible > 0 && posible <= 3 * 60 * 60 * 1000) {
                            almuerzo = posible;
                        }
                    }

                    trabajoMs += (salida - entrada - almuerzo);
                    almuerzoMs += almuerzo;
                });

                reporteFinal.push({
                    ID: emp.id,
                    Empleado: emp.nombre,
                    "Días trabajados": dias,
                    "Horas trabajadas": msToHora(trabajoMs),
                    "Horas de almuerzo": msToHora(almuerzoMs)
                });
            });

            reporteFinal.sort((a, b) => a.ID - b.ID);

            const tbody = document.getElementById("tablaResultados");
            if(reporteFinal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 italic">No se encontraron registros para el periodo seleccionado</td></tr>`;
                return;
            }

            reporteFinal.forEach(r => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 font-mono text-xs text-slate-500 font-bold">${r.ID}</td>
                        <td class="px-6 py-4 font-semibold text-slate-700">${r.Empleado}</td>
                        <td class="px-6 py-4 text-slate-600">${r["Días trabajados"]}</td>
                        <td class="px-6 py-4">
                            <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-bold border border-blue-100">
                                ${r["Horas trabajadas"]}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-600">${r["Horas de almuerzo"]}</td>
                    </tr>`;
            });
        }

        // ======================
        // EXPORTAR
        // ======================
        function exportarExcel() {
            if (!reporteFinal.length) {
                return;
            }

            const tipo = document.getElementById("tipoReporte").value;
            const fecha = document.getElementById("fechaBase").value;

            const hoja = [];
            hoja.push(["REPORTE BIOMETRICO DISTRITO MIRAFLORES - IMADE"]);
            hoja.push([`Periodo: ${tipo} | Fecha base: ${fecha}`]);
            hoja.push([]); 

            hoja.push([
                "ID Empleado",
                "Empleado",
                "Días trabajados",
                "Horas trabajadas",
                "Horas de almuerzo"
            ]);

            reporteFinal.forEach(r => {
                hoja.push([
                    r.ID,
                    r.Empleado,
                    r["Días trabajados"],
                    r["Horas trabajadas"],
                    r["Horas de almuerzo"]
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(hoja);

            ws["!cols"] = [
                { wch: 12 }, 
                { wch: 28 }, 
                { wch: 16 }, 
                { wch: 18 }, 
                { wch: 20 } 
            ];

            ws["!freeze"] = { xSplit: 0, ySplit: 4 };

            ws["!merges"] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 4 } }
            ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Resumen");

            XLSX.writeFile(wb, "Reporte_Biometrico_IMADE_Distrito.xlsx");
        }
    </script>
</body>

</html>
